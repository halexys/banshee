<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banshee · Panel</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="panel.css">
</head>
<body class="panel-body">
<div class="panel">
  <div class="ph">
    <svg class="logo" width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10a7 7 0 0 1 14 0v10l-2.5-2-2.3 2-2.2-2-2.2 2-2.3-2z"/><circle cx="9.5" cy="10.5" r="1"/><circle cx="14.5" cy="10.5" r="1"/></svg>
    <div class="pht">
      <span class="pn" id="pname">--</span>
      <span class="ps" id="psub">--</span>
    </div>
  </div>

  <div class="tiles">
    <div class="tile"><span class="tv" id="tcpu" style="color:var(--orange)">--</span><span class="tl">CPU</span></div>
    <div class="tile"><span class="tv" id="tgpu" style="color:var(--blue)">--</span><span class="tl">GPU</span></div>
    <div class="tile"><span class="tv" id="trpm" style="color:var(--teal)">--</span><span class="tl">RPM</span></div>
  </div>

  <div class="pp">
    <button type="button" data-p="silent" style="--c:var(--teal)"><i></i>Silencioso</button>
    <button type="button" data-p="balanced" style="--c:var(--blue)"><i></i>Equilibrado</button>
    <button type="button" data-p="extreme" style="--c:var(--orange)"><i></i>Extremo</button>
    <button type="button" data-p="superbatt" style="--c:var(--green)"><i></i>Super Bat.</button>
  </div>

  <button type="button" class="pboost" id="pboost" aria-pressed="false">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M12 10c0-4 1-7 4-7s3 4-2 7M14 12c4 0 7 1 7 4s-4 3-7-2M12 14c0 4-1 7-4 7s-3-4 2-7M10 12c-4 0-7-1-7-4s4-3 7 2"/></svg>
    <span>Fan Boost</span><span class="grow"></span><b id="pboostv">OFF</b>
  </button>

  <div class="pf">
    <button type="button" id="popen"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>Abrir</button>
    <button type="button" id="ppanic" class="panic" aria-label="Reset de pánico"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg></button>
  </div>
</div>
<script src="panel.js"></script>
</body>
</html>
