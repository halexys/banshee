[package]
name = "banshee"
version = "0.1.0"
edition = "2021"
description = "Banshee: MSI Prestige 16 control panel over msi-ec"
license = "GPL-3.0-or-later"

[[bin]]
name = "banshee"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
